<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chain Master Week — Event Card</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  }
  .download-btn {
    margin: 30px 0;
    padding: 14px 40px;
    font-size: 18px;
    font-weight: 600;
    color: #0a0a0f;
    background: linear-gradient(135deg, #f5c842, #ffd54f);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    letter-spacing: 1px;
    z-index: 100;
  }
  .download-btn:hover { opacity: 0.85; }
  .card {
    width: 1920px;
    height: 1080px;
    background: linear-gradient(145deg, #0a0a0f 0%, #12121f 40%, #1a1020 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Falling letter blocks scattered in background */
  .block {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.9);
    letter-spacing: 0;
  }
  .block.gold {
    background: linear-gradient(135deg, #d4a025 0%, #f5c842 50%, #d4a025 100%);
    box-shadow: 0 0 20px rgba(212, 160, 37, 0.4);
  }
  .block.dim {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.25);
  }
  .block.clearing {
    background: linear-gradient(135deg, #d4a025 0%, #f5c842 50%, #ffd54f 100%);
    box-shadow: 0 0 30px rgba(245, 200, 66, 0.6), 0 0 60px rgba(245, 200, 66, 0.2);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 30px rgba(245, 200, 66, 0.6); }
    50% { box-shadow: 0 0 50px rgba(245, 200, 66, 0.9), 0 0 80px rgba(245, 200, 66, 0.3); }
  }

  /* Chain arrow indicators */
  .chain-arrow {
    position: absolute;
    font-size: 36px;
    color: rgba(245, 200, 66, 0.5);
  }

  /* Cascade particles */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #f5c842;
    opacity: 0.5;
  }

  /* Main content */
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .badge {
    display: inline-block;
    background: rgba(245, 200, 66, 0.15);
    border: 1px solid rgba(245, 200, 66, 0.4);
    border-radius: 20px;
    padding: 8px 24px;
    font-size: 18px;
    font-weight: 600;
    color: #f5c842;
    text-transform: uppercase;
    letter-spacing: 3px;
  }
  .title {
    font-size: 96px;
    font-weight: 800;
    color: #fff;
    line-height: 1.05;
    text-shadow: 0 0 60px rgba(245, 200, 66, 0.2);
  }
  .title span {
    background: linear-gradient(135deg, #f5c842 0%, #ffd54f 50%, #f5c842 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    font-size: 36px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.6);
    max-width: 800px;
    line-height: 1.4;
  }
  .chain-count {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 8px;
  }
  .chain-count .num {
    font-size: 120px;
    font-weight: 900;
    background: linear-gradient(135deg, #f5c842 0%, #ffd54f 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }
  .chain-count .label {
    font-size: 28px;
    color: rgba(255, 255, 255, 0.5);
    text-align: left;
    line-height: 1.3;
  }

  /* Grid of cascading blocks — left side */
  .cascade-grid {
    position: absolute;
    left: 80px;
    top: 50%;
    transform: translateY(-50%);
    display: grid;
    grid-template-columns: repeat(4, 68px);
    grid-template-rows: repeat(5, 68px);
    gap: 6px;
  }

  /* Grid of cascading blocks — right side */
  .cascade-grid-right {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    display: grid;
    grid-template-columns: repeat(4, 68px);
    grid-template-rows: repeat(5, 68px);
    gap: 6px;
  }

  /* Glow line across bottom */
  .glow-line {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #f5c842, transparent);
    opacity: 0.5;
  }

  /* Corner accent */
  .corner-glow {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.15;
    background: #f5c842;
  }
  .corner-glow.tl { top: -200px; left: -200px; }
  .corner-glow.br { bottom: -200px; right: -200px; }

  /* App name watermark */
  .watermark {
    position: absolute;
    bottom: 40px;
    right: 60px;
    font-size: 22px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.2);
    letter-spacing: 4px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <!-- Background glows -->
  <div class="corner-glow tl"></div>
  <div class="corner-glow br"></div>

  <!-- Left cascade grid -->
  <div class="cascade-grid">
    <div class="block dim">W</div>
    <div class="block dim">A</div>
    <div class="block dim">R</div>
    <div class="block dim">K</div>
    <div class="block dim">O</div>
    <div class="block clearing">C</div>
    <div class="block clearing">H</div>
    <div class="block clearing">A</div>
    <div class="block dim">P</div>
    <div class="block clearing">I</div>
    <div class="block clearing">N</div>
    <div class="block dim">E</div>
    <div class="block gold">F</div>
    <div class="block gold">A</div>
    <div class="block gold">L</div>
    <div class="block gold">L</div>
    <div class="block dim">S</div>
    <div class="block dim">T</div>
    <div class="block dim">R</div>
    <div class="block dim">M</div>
  </div>

  <!-- Right cascade grid -->
  <div class="cascade-grid-right">
    <div class="block dim">L</div>
    <div class="block dim">I</div>
    <div class="block dim">N</div>
    <div class="block dim">D</div>
    <div class="block gold">D</div>
    <div class="block gold">R</div>
    <div class="block gold">O</div>
    <div class="block gold">P</div>
    <div class="block dim">V</div>
    <div class="block clearing">W</div>
    <div class="block clearing">O</div>
    <div class="block clearing">R</div>
    <div class="block dim">B</div>
    <div class="block clearing">D</div>
    <div class="block clearing">S</div>
    <div class="block dim">A</div>
    <div class="block dim">G</div>
    <div class="block dim">H</div>
    <div class="block dim">E</div>
    <div class="block dim">T</div>
  </div>

  <!-- Scattered particles -->
  <div class="particle" style="left:320px; top:280px; width:6px; height:6px; opacity:0.7;"></div>
  <div class="particle" style="left:350px; top:400px;"></div>
  <div class="particle" style="left:280px; top:500px; width:5px; height:5px;"></div>
  <div class="particle" style="right:320px; top:350px; width:6px; height:6px; opacity:0.6;"></div>
  <div class="particle" style="right:280px; top:480px;"></div>
  <div class="particle" style="right:360px; top:600px; width:5px; height:5px;"></div>

  <!-- Center content -->
  <div class="content">
    <div class="badge">⚡ Challenge</div>
    <div class="title"><span>Chain Master</span><br>Week</div>
    <div class="subtitle">Trigger a 5+ word chain reaction in a single game</div>
  </div>

  <div class="glow-line"></div>
  <div class="watermark">Plummet: Word Fall</div>
</div>
<button class="download-btn" onclick="downloadCard()">Download as PNG</button>
<script>
function downloadCard() {
  const card = document.querySelector('.card');
  html2canvas(card, { scale: 1, width: 1920, height: 1080, backgroundColor: '#0a0a0f' }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'chain-master-week-event-card.jpg';
    link.href = canvas.toDataURL('image/jpeg', 1.0);
    link.click();
  });
}
</script>
</body>
</html>
